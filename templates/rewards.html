<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分奖励</title>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#4B7791">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="作业清单">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/style.css?v=20261113">
<style>
.points-split { font-size:13px; color:#8a8277; margin-top:6px; }
.points-split b { color:#5a5248; }
.rec-tabs { display:flex; gap:8px; margin-bottom:10px; }
.rec-tab {
    flex:1; padding:8px 0; font-size:14px; border:1px solid #e7e0d4; border-radius:8px;
    background:#faf7f0; color:#6b6459; cursor:pointer; font-family:inherit;
}
.rec-tab.active { background:#e8e1d0; color:#3a352e; font-weight:600; border-color:#d9d0bf; }
.rec-item { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid #f1ece2; font-size:14px; }
.rec-item .rec-main { flex:1; min-width:0; }
.rec-item .rec-date { font-size:12px; color:#9a9388; margin-bottom:2px; }
.rec-item .rec-detail { font-size:12px; color:#8a8277; margin-top:3px; line-height:1.6; }
.rec-item .rec-pts { font-weight:600; white-space:nowrap; }
.rec-empty { color:#9a9388; font-size:14px; padding:12px 0; text-align:center; }
</style>
</head>
<body>

<div class="top-bar">
    <div>
        <h1>🏆 积分奖励</h1>
        <div class="date-display" style="font-size:13px;opacity:0.8;"></div>
    </div>
    <div id="topBarActions" style="display:flex;gap:8px;align-items:center;"></div>
</div>

<div class="main-content">

    <!-- 当前积分 -->
    <div class="points-big">
        <div style="font-size:14px;color:#999;">当前可用积分</div>
        <div class="number" id="totalPoints">0</div>
        <div class="points-split">累计 <b id="earnedPoints">0</b> · 已兑换 <b id="spentPoints">0</b></div>
    </div>

    <!-- 徽章墙 -->
    <div class="admin-section">
        <h3>🏅 我的徽章</h3>
        <div id="badgeWall" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;"></div>
    </div>

    <!-- 可兑换奖励 -->
    <div class="admin-section">
        <h3>🎁 可兑换奖励</h3>
        <div id="rewardList"></div>
    </div>

    <!-- 积分记录 -->
    <div class="admin-section">
        <h3>📊 积分记录</h3>
        <div class="rec-tabs">
            <button class="rec-tab active" id="tabEarn" onclick="switchRecTab('earn')">获得</button>
            <button class="rec-tab" id="tabSpend" onclick="switchRecTab('spend')">消费</button>
        </div>
        <div id="pointsRecords" style="max-height:340px;overflow-y:auto;"></div>
    </div>

</div>

<div class="bottom-nav">
    <a href="/"><span class="icon">📋</span>今日</a>
    <a href="/rewards" class="active"><span class="icon">🏆</span>奖励</a>
    <a href="/history"><span class="icon">📅</span>历史</a>
    <a href="/notes"><span class="icon">📝</span>随手记<span id="notesDueBadge" style="display:none;position:absolute;top:-2px;right:-4px;background:#e74c3c;color:white;font-size:10px;line-height:1;padding:0 4px;border-radius:8px;"></span></a>
    <a href="/apps"><span class="icon">🧩</span>应用</a>
    <a href="/guide"><span class="icon">📖</span>指南</a>
</div>

<script src="/static/js/common.js?v=20261113b"></script>
<script>
let rewardsChildId = 1;
let lastRecords = [];
let recTab = 'earn';   // earn 获得 / spend 消费

const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s + 'T00:00:00');
    if (isNaN(d.getTime())) return s;
    return `${d.getMonth() + 1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
}

function switchRecTab(tab) {
    recTab = tab;
    document.getElementById('tabEarn').classList.toggle('active', tab === 'earn');
    document.getElementById('tabSpend').classList.toggle('active', tab === 'spend');
    renderRecords();
}

function renderRecords() {
    const el = document.getElementById('pointsRecords');
    const list = lastRecords.filter(r => recTab === 'earn' ? r.points > 0 : r.points < 0);
    if (!list.length) {
        el.innerHTML = `<div class="rec-empty">${recTab === 'earn' ? '还没有获得积分的记录' : '还没有兑换记录'}</div>`;
        return;
    }
    let html = '';
    list.forEach(r => {
        const isEarn = r.points > 0;
        const color = isEarn ? '#3f8f52' : '#c4553a';
        const sign = isEarn ? '+' : '';
        let detailHtml = '';
        if (r.detail) {
            try {
                const arr = JSON.parse(r.detail);
                if (Array.isArray(arr) && arr.length) {
                    detailHtml = '<div class="rec-detail">' + arr.map(d => `${d.reason} +${d.points}`).join(' · ') + '</div>';
                }
            } catch (e) {}
        }
        html += '<div class="rec-item">';
        html += '<div class="rec-main">';
        html += `<div class="rec-date">${fmtDate(r.date)}</div>`;
        html += `<div>${r.reason}</div>`;
        html += detailHtml;
        html += '</div>';
        html += `<div class="rec-pts" style="color:${color};">${sign}${r.points}</div>`;
        html += '</div>';
    });
    el.innerHTML = html;
}

// common.js 已负责渲染顶部按钮 + 孩子切换（switchGlobalChild 会 reload）
(async () => {
    const me = await getCurrentChild();
    if (me) rewardsChildId = me.id;
    await loadData();  // loadData 会更新 #totalPoints + 奖励列表 + 积分记录
    loadBadges();
})();

async function loadBadges() {
    // 获取连续打卡天数
    const streakRes = await fetch(`/api/streak?child_id=${rewardsChildId}`);
    const streakData = await streakRes.json();
    const streak = streakData.streak;

    // 获取总积分
    const pointsRes = await fetch(`/api/points?child_id=${rewardsChildId}`);
    const pointsData = await pointsRes.json();
    const totalPoints = pointsData.total;

    const badges = [
        {name: '初次完成', desc: '第一次完成作业', icon: '🌱', earned: streak >= 1},
        {name: '连续7天', desc: '连续打卡7天', icon: '🔥', earned: streak >= 7},
        {name: '连续30天', desc: '连续打卡30天', icon: '💪', earned: streak >= 30},
        {name: '积分达人', desc: '累计获得500积分', icon: '💰', earned: totalPoints >= 500},
        {name: '积分富翁', desc: '累计获得2000积分', icon: '👑', earned: totalPoints >= 2000},
        {name: '全勤之星', desc: '连续7天全完成', icon: '⭐', earned: streak >= 7},
    ];

    let html = '';
    badges.forEach(b => {
        html += `<div style="padding:12px;background:${b.earned ? '#e8f5e9' : '#f5f5f5'};border-radius:8px;opacity:${b.earned ? 1 : 0.5};">`;
        html += `<div style="font-size:32px;">${b.icon}</div>`;
        html += `<div style="font-size:13px;font-weight:600;margin-top:4px;">${b.name}</div>`;
        html += `<div style="font-size:11px;color:#999;">${b.desc}</div>`;
        html += `</div>`;
    });
    document.getElementById('badgeWall').innerHTML = html;
}

async function loadData() {
    // 积分和记录
    const res = await fetch(`/api/points?child_id=${rewardsChildId}`);
    const data = await res.json();
    document.getElementById('totalPoints').textContent = data.total;
    document.getElementById('earnedPoints').textContent = data.earned || 0;
    document.getElementById('spentPoints').textContent = data.spent || 0;

    // 记录：分成「获得」「消费」两组
    const all = data.records || [];
    lastRecords = all;
    renderRecords();

    loadBadges();

    // 奖励列表（从设置获取）
    const settingsRes = await fetch(`/api/settings?child_id=${rewardsChildId}`);
    const settings = await settingsRes.json();
    const rewardList = document.getElementById('rewardList');
    let rHtml = '';
    settings.rewards.forEach(r => {
        const canAfford = data.total >= r.points;
        rHtml += `<div class="reward-item">`;
        rHtml += `<div><div class="name">${r.name}</div></div>`;
        rHtml += `<div style="display:flex;align-items:center;gap:12px;">`;
        rHtml += `<span class="cost">${r.points}分</span>`;
        rHtml += `<button onclick="redeem('${r.id}')" ${canAfford ? '' : 'disabled'}>兑换</button>`;
        rHtml += `</div></div>`;
    });
    rewardList.innerHTML = rHtml;
}

async function redeem(rewardId) {
    if (!confirm('确定兑换这个奖励吗？')) return;
    const res = await fetch(`/api/points/redeem?child_id=${rewardsChildId}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({reward_id: rewardId})
    });
    const data = await res.json();
    if (data.success) {
        alert('兑换成功！');
        loadData();
    } else {
        alert(data.error || '兑换失败');
    }
}
</script>

</body>
</html>
